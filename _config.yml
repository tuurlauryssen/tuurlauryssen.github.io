# GitHub Pages build settings.
#
# Everything in this repo is published unless excluded here. Keep internal
# material off the public site:
# - posts/raw: untouched Beehiiv exports. They still carry Beehiiv's own
#   <script> tags and platform config, which would run on this domain.
# - posts/incoming: import drop folders.
# - scripts: local import tooling.
# - Markdown docs/prompts: internal workflow notes, not site pages.
exclude:
  - posts/raw
  - posts/incoming
  - posts/README.md
  - scripts
  - README.md
  - POST_WORKFLOW.md
  - CONTENT_PROMPTS.md
  - SECURITY_AUDIT_PROMPT.md
