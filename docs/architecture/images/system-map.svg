<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>INSPIRE system map: every platform and every connection</title>
  <defs>
    <marker id="a-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2C45"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A23B3B"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8752E"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F6B4A"/></marker>
    <style>
      .t { fill:#141210; font-size:13px; }
      .s { fill:#4B5563; font-size:11.5px; }
      .h { fill:#1B2C45; font-size:15px; font-weight:700; }
      .zone { font-size:12px; font-weight:700; letter-spacing:1.5px; }
      .box { fill:#FFFFFF; stroke:#1B2C45; stroke-width:1.4; }
      .lbl { font-size:11px; font-weight:600; }
      .lbg { fill:#F5F0E8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="900" rx="18" fill="#F5F0E8"/>
  <text x="40" y="44" fill="#1B2C45" font-size="24" font-weight="700" font-family="Georgia, 'Cormorant Garamond', serif">INSPIRE · system map</text>
  <text x="40" y="66" class="s">Every platform involved, and what flows between them. Solid = public traffic · dashed red = needs a secret token · amber = automation · green = email</text>

  <!-- ============ ACTORS ROW ============ -->
  <g>
    <rect x="40" y="96" width="270" height="78" rx="12" class="box"/>
    <text x="58" y="122" class="h">👤 Readers' browsers</text>
    <text x="58" y="142" class="s">Anyone on the internet visiting</text>
    <text x="58" y="158" class="s">tuurlauryssen.com (EN + /nl/)</text>
  </g>
  <g>
    <rect x="470" y="96" width="330" height="78" rx="12" class="box"/>
    <text x="488" y="122" class="h">🧑‍💻 Tuur (author &amp; admin)</text>
    <text x="488" y="142" class="s">Windows PC: PowerShell scripts, git + gh,</text>
    <text x="488" y="158" class="s">Supabase CLI, Excel content pipeline</text>
  </g>
  <g>
    <rect x="960" y="96" width="280" height="78" rx="12" class="box"/>
    <text x="978" y="122" class="h">🤖 Scheduled agents</text>
    <text x="978" y="142" class="s">"analytics" + "inbox" agents that</text>
    <text x="978" y="158" class="s">read the weekly report (outside repos)</text>
  </g>

  <!-- ============ GITHUB ZONE ============ -->
  <rect x="40" y="236" width="370" height="440" rx="16" fill="#E4EAF3" stroke="#2B4C7E" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="58" y="260" class="zone" fill="#2B4C7E">GITHUB</text>

  <rect x="60" y="276" width="330" height="70" rx="10" class="box"/>
  <text x="76" y="300" class="t" font-weight="700">tuurlauryssen.github.io</text>
  <text x="76" y="318" class="s">PUBLIC repo · static HTML/CSS/JS, posts,</text>
  <text x="76" y="334" class="s">posts.json manifest, import scripts</text>

  <rect x="60" y="376" width="330" height="62" rx="10" class="box"/>
  <text x="76" y="400" class="t" font-weight="700">GitHub Pages → tuurlauryssen.com</text>
  <text x="76" y="418" class="s">CNAME custom domain · HTTPS · no build step</text>

  <rect x="60" y="476" width="330" height="62" rx="10" class="box"/>
  <text x="76" y="500" class="t" font-weight="700">inspire-backend</text>
  <text x="76" y="518" class="s">PRIVATE repo · functions, migrations, design system</text>

  <rect x="60" y="566" width="330" height="92" rx="10" class="box"/>
  <text x="76" y="590" class="t" font-weight="700">GitHub Actions</text>
  <text x="76" y="608" class="s">backup.yml · Sun 03:00 UTC · pg_dump</text>
  <text x="76" y="624" class="s">keepalive.yml · Mon+Thu 06:00 UTC · ping</text>
  <text x="76" y="642" class="s">→ backup.sql artifact, kept 30 days</text>

  <!-- repo -> pages -->
  <line x1="225" y1="346" x2="225" y2="372" stroke="#B8752E" stroke-width="2" marker-end="url(#a-amber)"/>
  <rect x="232" y="350" width="110" height="18" rx="4" class="lbg"/>
  <text x="238" y="363" class="lbl" fill="#B8752E">auto-deploy on merge</text>
  <!-- backend repo -> actions -->
  <line x1="225" y1="538" x2="225" y2="562" stroke="#B8752E" stroke-width="2" marker-end="url(#a-amber)"/>
  <rect x="232" y="541" width="100" height="18" rx="4" class="lbg"/>
  <text x="238" y="554" class="lbl" fill="#B8752E">workflows + secret</text>

  <!-- ============ SUPABASE ZONE ============ -->
  <rect x="470" y="236" width="430" height="440" rx="16" fill="#E7EEE7" stroke="#3F6B4A" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="488" y="260" class="zone" fill="#3F6B4A">SUPABASE</text>
  <text x="584" y="260" class="s">project ref jnhygvustbwwzfqrpklr</text>

  <rect x="490" y="276" width="390" height="214" rx="10" class="box"/>
  <text x="506" y="300" class="t" font-weight="700">Edge Functions (Deno) · 10 endpoints</text>
  <text x="506" y="318" class="s">Every request: CORS allow-list → JSON parse → validate</text>
  <text x="506" y="333" class="s">→ per-IP rate limit → service-role DB query</text>
  <rect x="506" y="344" width="178" height="134" rx="8" fill="#F5F0E8" stroke="#DDD4C0"/>
  <text x="516" y="362" class="lbl" fill="#1B2C45">PUBLIC (no login)</text>
  <text x="516" y="379" class="s">subscribe</text>
  <text x="516" y="394" class="s">contact-message</text>
  <text x="516" y="409" class="s">article-like-toggle</text>
  <text x="516" y="424" class="s">article-community-summary</text>
  <text x="516" y="439" class="s">article-read-track / -summary</text>
  <text x="516" y="454" class="s">article-comment-submit</text>
  <text x="516" y="469" class="s">article-comments-list</text>
  <rect x="694" y="344" width="172" height="134" rx="8" fill="#F5E2DF" stroke="#E2B8B1"/>
  <text x="704" y="362" class="lbl" fill="#A23B3B">TOKEN REQUIRED 🔒</text>
  <text x="704" y="381" class="s">list-subscribers</text>
  <text x="704" y="396" class="s">  ↳ INSPIRE_ADMIN_TOKEN</text>
  <text x="704" y="418" class="s">weekly-report (read-only)</text>
  <text x="704" y="433" class="s">  ↳ INSPIRE_REPORT_TOKEN</text>
  <text x="704" y="458" class="s">Bearer token, compared</text>
  <text x="704" y="472" class="s">in constant time</text>

  <rect x="490" y="534" width="390" height="124" rx="10" class="box"/>
  <text x="506" y="558" class="t" font-weight="700">Postgres database · RLS on every table</text>
  <text x="506" y="577" class="s">subscribers · contact_messages · article_likes</text>
  <text x="506" y="593" class="s">article_comments · article_reads · rate_limits</text>
  <text x="506" y="613" class="s">Only the service_role may read/write. The public</text>
  <text x="506" y="629" class="s">anon key gets nothing, so the browser can't query it.</text>
  <text x="506" y="647" class="s">+ check_rate_limit() function</text>

  <line x1="685" y1="490" x2="685" y2="530" stroke="#1B2C45" stroke-width="2" marker-end="url(#a-navy)"/>
  <rect x="692" y="500" width="150" height="18" rx="4" class="lbg"/>
  <text x="698" y="513" class="lbl" fill="#1B2C45">service-role key (secret)</text>

  <!-- ============ THIRD PARTIES ============ -->
  <rect x="960" y="236" width="280" height="620" rx="16" fill="#F7ECDA" stroke="#B8752E" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="978" y="260" class="zone" fill="#B8752E">THIRD-PARTY SERVICES</text>

  <rect x="980" y="276" width="240" height="56" rx="10" class="box"/>
  <text x="996" y="299" class="t" font-weight="700">✉️ Resend</text>
  <text x="996" y="318" class="s">Email API (RESEND_API_KEY)</text>

  <rect x="980" y="352" width="240" height="56" rx="10" class="box"/>
  <text x="996" y="375" class="t" font-weight="700">📥 Tuur's inbox</text>
  <text x="996" y="394" class="s">new subscriber + contact alerts</text>

  <rect x="980" y="438" width="240" height="72" rx="10" class="box"/>
  <text x="996" y="461" class="t" font-weight="700">📰 Beehiiv</text>
  <text x="996" y="479" class="s">where posts are written; HTML is</text>
  <text x="996" y="495" class="s">exported; some images still hotlinked</text>

  <rect x="980" y="530" width="240" height="72" rx="10" class="box"/>
  <text x="996" y="553" class="t" font-weight="700">📊 Google Analytics 4</text>
  <text x="996" y="571" class="s">G-06BN0LL37Q · no cookies,</text>
  <text x="996" y="587" class="s">anonymized IP, per-page-load ID</text>

  <rect x="980" y="622" width="240" height="56" rx="10" class="box"/>
  <text x="996" y="645" class="t" font-weight="700">🔤 Google Fonts</text>
  <text x="996" y="664" class="s">Cormorant Garamond + DM Sans</text>

  <rect x="980" y="698" width="240" height="56" rx="10" class="box"/>
  <text x="996" y="721" class="t" font-weight="700">📦 esm.sh CDN</text>
  <text x="996" y="740" class="s">supabase-js 2.112.4 (at deploy)</text>

  <rect x="980" y="774" width="240" height="62" rx="10" class="box"/>
  <text x="996" y="797" class="t" font-weight="700">🤖 AI writing assistants</text>
  <text x="996" y="816" class="s">CONTENT_PROMPTS.md (drafting,</text>
  <text x="996" y="830" class="s">editorial review)</text>

  <!-- Resend -> inbox -->
  <line x1="1100" y1="332" x2="1100" y2="348" stroke="#3F6B4A" stroke-width="2" marker-end="url(#a-green)"/>

  <!-- ============ CONNECTIONS ============ -->
  <!-- 1 browser -> pages -->
  <path d="M120,174 L120,372" fill="none" stroke="#1B2C45" stroke-width="2" marker-end="url(#a-navy)"/>
  <rect x="70" y="190" width="100" height="32" rx="4" class="lbg"/>
  <text x="76" y="203" class="lbl" fill="#1B2C45">① GET pages,</text>
  <text x="76" y="217" class="lbl" fill="#1B2C45">CSS, JS, posts</text>

  <!-- 2 browser -> edge functions -->
  <path d="M260,174 L260,206 L560,206 L560,272" fill="none" stroke="#1B2C45" stroke-width="2" marker-end="url(#a-navy)"/>
  <rect x="300" y="196" width="226" height="20" rx="4" class="lbg"/>
  <text x="306" y="210" class="lbl" fill="#1B2C45">② fetch() JSON: subscribe, like, read…</text>

  <!-- 3 browser -> GA / fonts / beehiiv images: route along bottom -->
  <path d="M40,135 L22,135 L22,880 L940,880 L940,566 L976,566" fill="none" stroke="#1B2C45" stroke-width="1.6" stroke-dasharray="2 0" marker-end="url(#a-navy)"/>
  <path d="M940,650 L976,650" fill="none" stroke="#1B2C45" stroke-width="1.6" marker-end="url(#a-navy)"/>
  <path d="M940,490 L976,490" fill="none" stroke="#1B2C45" stroke-width="1.6" marker-end="url(#a-navy)"/>
  <rect x="430" y="870" width="370" height="20" rx="4" class="lbg"/>
  <text x="436" y="884" class="lbl" fill="#1B2C45">③ browser also loads: GA events · Google Fonts · Beehiiv images</text>

  <!-- 4 edge -> resend -->
  <path d="M880,300 L976,300" fill="none" stroke="#3F6B4A" stroke-width="2" marker-end="url(#a-green)"/>
  <rect x="902" y="280" width="54" height="16" rx="4" class="lbg"/>
  <text x="906" y="292" class="lbl" fill="#3F6B4A">④ email</text>

  <!-- 5 Tuur -> public repo (posts) -->
  <path d="M520,174 L520,226 L360,226 L360,272" fill="none" stroke="#B8752E" stroke-width="2" marker-end="url(#a-amber)"/>
  <rect x="364" y="228" width="98" height="32" rx="4" class="lbg" opacity="0"/>

  <!-- 6 Tuur -> Supabase (CLI deploy / admin export) -->
  <path d="M790,174 L790,272" fill="none" stroke="#A23B3B" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#a-red)"/>
  <rect x="656" y="214" width="128" height="32" rx="4" class="lbg"/>
  <text x="660" y="227" class="lbl" fill="#A23B3B">⑥ admin export +</text>
  <text x="660" y="241" class="lbl" fill="#A23B3B">CLI deploy / db push</text>

  <!-- 7 Tuur -> Beehiiv -->
  <path d="M800,150 L930,150 L930,460 L976,460" fill="none" stroke="#B8752E" stroke-width="2" marker-end="url(#a-amber)"/>
  <rect x="806" y="134" width="118" height="16" rx="4" class="lbg"/>
  <text x="810" y="146" class="lbl" fill="#B8752E">⑦ write + export HTML</text>

  <!-- 8 agents -> weekly-report -->
  <path d="M1000,174 L1000,206 L850,206 L850,272" fill="none" stroke="#A23B3B" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#a-red)"/>
  <rect x="862" y="186" width="130" height="18" rx="4" class="lbg"/>
  <text x="866" y="199" class="lbl" fill="#A23B3B">⑧ GET weekly-report</text>

  <!-- 9 actions -> postgres (backup) -->
  <path d="M390,620 L486,620" fill="none" stroke="#A23B3B" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#a-red)"/>
  <rect x="398" y="600" width="80" height="16" rx="4" class="lbg"/>
  <text x="402" y="612" class="lbl" fill="#A23B3B">⑨ pg_dump</text>
  <!-- 10 actions -> edge (keepalive) -->
  <path d="M390,592 L440,592 L440,420 L486,420" fill="none" stroke="#B8752E" stroke-width="2" marker-end="url(#a-amber)"/>
  <rect x="416" y="448" width="50" height="32" rx="4" class="lbg"/>
  <text x="420" y="461" class="lbl" fill="#B8752E">(10) keep</text>
  <text x="420" y="475" class="lbl" fill="#B8752E">alive</text>

  <!-- 5 label -->
  <rect x="372" y="160" width="92" height="32" rx="4" class="lbg"/>
  <text x="376" y="173" class="lbl" fill="#B8752E">⑤ import post</text>
  <text x="376" y="187" class="lbl" fill="#B8752E">→ branch + PR</text>
  <path d="M470,176 L466,176" stroke="none"/>

  <!-- legend box -->
  <rect x="40" y="700" width="870" height="150" rx="12" fill="#FFFFFF" stroke="#DDD4C0"/>
  <text x="58" y="724" class="h">Reading the numbers</text>
  <text x="58" y="748" class="s">① Visitors download static files from GitHub Pages (no server code).</text>
  <text x="500" y="748" class="s">⑥ Export-Subscribers.cmd (admin token) · Supabase CLI deploys.</text>
  <text x="58" y="768" class="s">② Page JS calls Supabase Edge Functions; URLs are in site-config.js.</text>
  <text x="500" y="768" class="s">⑦ Posts are written in Beehiiv first (tuurlauryssen.beehiiv.com).</text>
  <text x="58" y="788" class="s">③ Pages also load GA, Google Fonts and Beehiiv-hosted images.</text>
  <text x="500" y="788" class="s">⑧ Agents use a separate, read-only report token.</text>
  <text x="58" y="808" class="s">④ Subscribe + contact send you an alert email via Resend.</text>
  <text x="500" y="808" class="s">⑨ Weekly full DB dump via the pooler (SUPABASE_DB_URL secret).</text>
  <text x="58" y="828" class="s">⑤ process-new-posts.ps1 turns a Beehiiv export into a PR; merge = live.</text>
  <text x="500" y="828" class="s">(10) Twice-weekly ping keeps the free tier from pausing.</text>
</svg>
