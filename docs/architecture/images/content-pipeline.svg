<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>INSPIRE content pipeline: from idea to live article</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B8752E"/></marker>
    <style>
      .h { fill:#1B2C45; font-size:14px; font-weight:700; }
      .s { fill:#374151; font-size:11.5px; }
      .w { fill:#6B7280; font-size:10.5px; font-weight:700; letter-spacing:1px; }
      .n { fill:#FFFFFF; font-size:14px; font-weight:700; }
      .card { fill:#FFFFFF; stroke:#1B2C45; stroke-width:1.3; }
      .flow { stroke:#B8752E; stroke-width:2.5; fill:none; }
    </style>
  </defs>
  <rect width="1280" height="560" rx="18" fill="#F5F0E8"/>
  <text x="40" y="44" fill="#1B2C45" font-size="24" font-weight="700" font-family="Georgia, 'Cormorant Garamond', serif">Content pipeline: idea → live article</text>
  <text x="40" y="66" class="s">Grey labels say where each step happens. Nothing goes live until you merge a pull request.</text>

  <!-- Row 1 -->
  <g>
    <rect x="40" y="96" width="270" height="170" rx="14" class="card"/>
    <circle cx="68" cy="124" r="15" fill="#1B2C45"/><text x="68" y="129" text-anchor="middle" class="n">1</text>
    <text x="92" y="129" class="h">💡 Capture the idea</text>
    <text x="58" y="156" class="w">EXCEL · inspire-backend/content/</text>
    <text x="58" y="180" class="s">"Content Pipeline.xlsx" tracks ~200</text>
    <text x="58" y="196" class="s">ideas: format (Column / Explained),</text>
    <text x="58" y="212" class="s">category, status (Inbox → …), rank,</text>
    <text x="58" y="228" class="s">target date, views, notes.</text>
  </g>
  <g>
    <rect x="350" y="96" width="270" height="170" rx="14" class="card"/>
    <circle cx="378" cy="124" r="15" fill="#1B2C45"/><text x="378" y="129" text-anchor="middle" class="n">2</text>
    <text x="402" y="129" class="h">✍️ Draft</text>
    <text x="368" y="156" class="w">AI ASSISTANT · CONTENT_PROMPTS.md</text>
    <text x="368" y="180" class="s">Two prompts:</text>
    <text x="368" y="196" class="s">• Column: personal, first person,</text>
    <text x="368" y="212" class="s">   700 to 1100 words</text>
    <text x="368" y="228" class="s">• Explained: mechanism-first,</text>
    <text x="368" y="244" class="s">   no "I", 500 to 800 words</text>
  </g>
  <g>
    <rect x="660" y="96" width="270" height="170" rx="14" class="card"/>
    <circle cx="688" cy="124" r="15" fill="#1B2C45"/><text x="688" y="129" text-anchor="middle" class="n">3</text>
    <text x="712" y="129" class="h">📰 Publish on Beehiiv</text>
    <text x="678" y="156" class="w">BEEHIIV · tuurlauryssen.beehiiv.com</text>
    <text x="678" y="180" class="s">The newsletter edition is made and</text>
    <text x="678" y="196" class="s">sent from Beehiiv. Then copy the</text>
    <text x="678" y="212" class="s">HTML of the LIVE page (not the</text>
    <text x="678" y="228" class="s">draft preview, which has a banner</text>
    <text x="678" y="244" class="s">and dev scripts baked in).</text>
  </g>
  <g>
    <rect x="970" y="96" width="270" height="170" rx="14" class="card"/>
    <circle cx="998" cy="124" r="15" fill="#1B2C45"/><text x="998" y="129" text-anchor="middle" class="n">4</text>
    <text x="1022" y="129" class="h">📂 Drop the file</text>
    <text x="988" y="156" class="w">SITE REPO · posts/incoming/</text>
    <text x="988" y="180" class="s">explained/en · explained/nl</text>
    <text x="988" y="196" class="s">ideas/en · ideas/nl</text>
    <text x="988" y="220" class="s">The folder tells the script the</text>
    <text x="988" y="236" class="s">type and language. The filename</text>
    <text x="988" y="252" class="s">doesn't matter.</text>
  </g>
  <path class="flow" d="M310,181 L346,181" marker-end="url(#arr)"/>
  <path class="flow" d="M620,181 L656,181" marker-end="url(#arr)"/>
  <path class="flow" d="M930,181 L966,181" marker-end="url(#arr)"/>
  <path class="flow" d="M1105,266 L1105,296" marker-end="url(#arr)"/>

  <!-- Row 2: the script, big card -->
  <g>
    <rect x="660" y="300" width="580" height="236" rx="14" fill="#FFFFFF" stroke="#B8752E" stroke-width="2"/>
    <circle cx="688" cy="328" r="15" fill="#B8752E"/><text x="688" y="333" text-anchor="middle" class="n">5</text>
    <text x="712" y="333" class="h">⚙️ Run scripts/process-new-posts.cmd</text>
    <text x="678" y="358" class="w">YOUR WINDOWS PC · POWERSHELL · git + gh</text>
    <text x="678" y="384" class="s">For each incoming file:</text>
    <text x="690" y="404" class="s">a. read the title, date, excerpt, author(s) and images from the HTML</text>
    <text x="690" y="422" class="s">b. strip scripts, forms, nav, Beehiiv classes/styles, "Keep reading" blocks</text>
    <text x="690" y="440" class="s">c. download images → assets/img/posts/&lt;slug&gt;/ (no more hotlinking)</text>
    <text x="690" y="458" class="s">d. write posts/&lt;type&gt;/&lt;lang&gt;/&lt;slug&gt;.html + archive the original in posts/raw/</text>
    <text x="690" y="476" class="s">e. update assets/data/posts.json + posts-data.js (+ authors.json)</text>
    <text x="690" y="494" class="s">f. new branch → commit → push → open a PR (or print a compare link)</text>
    <text x="678" y="522" class="s" font-style="italic">Refuses to run if your git tree has uncommitted changes.</text>
  </g>
  <path class="flow" d="M660,418 L624,418" marker-end="url(#arr)"/>
  <g>
    <rect x="350" y="300" width="270" height="236" rx="14" class="card"/>
    <circle cx="378" cy="328" r="15" fill="#1B2C45"/><text x="378" y="333" text-anchor="middle" class="n">6</text>
    <text x="402" y="333" class="h">👀 Review &amp; merge</text>
    <text x="368" y="358" class="w">GITHUB · PULL REQUEST</text>
    <text x="368" y="384" class="s">You check the diff and merge.</text>
    <text x="368" y="400" class="s">Nothing auto-merges.</text>
    <text x="368" y="428" class="s">⚠️ Add the new URL to sitemap.xml</text>
    <text x="368" y="444" class="s">by hand; the script doesn't.</text>
    <text x="368" y="472" class="s">Hidden posts: set "visibility":</text>
    <text x="368" y="488" class="s">"hidden" in posts.json to keep a</text>
    <text x="368" y="504" class="s">post off the homepage/archive</text>
    <text x="368" y="520" class="s">(the direct URL still works).</text>
  </g>
  <path class="flow" d="M350,418 L314,418" marker-end="url(#arr)"/>
  <g>
    <rect x="40" y="300" width="270" height="236" rx="14" fill="#1B2C45"/>
    <circle cx="68" cy="328" r="15" fill="#F5F0E8"/><text x="68" y="333" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2C45">7</text>
    <text x="92" y="333" fill="#F5F0E8" font-size="14" font-weight="700">🚀 Live</text>
    <text x="58" y="358" fill="#B9C2D0" font-size="10.5" font-weight="700" letter-spacing="1">GITHUB PAGES · tuurlauryssen.com</text>
    <text x="58" y="384" fill="#EAE3D5" font-size="11.5">Pages redeploys on merge to main.</text>
    <text x="58" y="408" fill="#EAE3D5" font-size="11.5">Homepage + archive read posts-</text>
    <text x="58" y="424" fill="#EAE3D5" font-size="11.5">data.js, filter by language and</text>
    <text x="58" y="440" fill="#EAE3D5" font-size="11.5">visibility, and render cards.</text>
    <text x="58" y="464" fill="#EAE3D5" font-size="11.5">The article page starts counting</text>
    <text x="58" y="480" fill="#EAE3D5" font-size="11.5">reads and likes in Supabase, and</text>
    <text x="58" y="496" fill="#EAE3D5" font-size="11.5">GA events, from the first visit.</text>
    <text x="58" y="520" fill="#B9C2D0" font-size="11" font-style="italic">Fix by hand? run sync-posts-manifest</text>
  </g>
</svg>
